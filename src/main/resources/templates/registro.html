<!DOCTYPE html> 
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"> 
    <head> 
        <title>Minha Agenda PetShop</title> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    </head> 
    
    <body> 
        <div class="container">
            
            <h1 class="mt-3 text-center" style="color: blueviolet;" >Meus Agendamentos</h1>
            
            <a th:href="@{/home}">
                 <input class="btn mt-3" style="background-color: blueviolet; color: whitesmoke" type="submit" value="Voltar">
            </a>
            
            <table class="mt-5 table table-hover"> 
              <thead> 
                <tr> 
                    <th>Pet</th> 
                    <th>Data</th> 
                    <th>Horário</th>
                   <th>Profissional</th>
                   <th>Serviço</th>
                   <th>Ações</th>
                </tr> 
              </thead> 
                 <tbody> 
                   <tr th:each="agendar: ${agendas}"> 
                        <td th:text="${agendar.nome_pet}"></td> 
                        <td th:text="${agendar.data}"></td> 
                      <td th:text="${agendar.horario}"></td>
                      <td th:text="${agendar.profissional}"></td> 
                      <td th:text="${agendar.serviços}"></td> 
                      <td>
                          <a th:href="@{'/reagendar?id=' +${agendar.id}}">
                            <input class="btn btn-info" type="button" value="Reagendar">
                          </a>
                      </td>
                      <td>
                          <a th:href="@{'/cancelar?id=' +${agendar.id}}">
                            <input class="btn btn-danger" type="button" value="Cancelar">
                          </a>
                      </td>              
                  </tr> 
               </tbody> 
            </table> 
        
        </div>
         

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous">
    </body>
    </html>
