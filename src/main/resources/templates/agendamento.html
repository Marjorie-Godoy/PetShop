<!DOCTYPE html> 
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"> 
    <head> 
        <title>Agenda Atendimento</title> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    </head> 
    
    <body> 
        <div class="container">
            <h1 th:if="${agendar.id}" class="mt-3 text-center" style="color: blueviolet;" >Alterando Agendamento</h1>
            <h1 th:unless="${agendar.id}" class="mt-3 text-center" style="color: blueviolet;" >Agendamento</h1>
            
            
            <form class="row mt-5" th:action="@{/agendamento}" method="post" th:object='${agendar}'>
                        
                <p>Qual pet será atendido?</p>
                            
                <input type="hidden" th:field="${agendar.id}" />
                
                <div class="form-group col-sm-4 mt-1">
                    <label for="nome_pet">Nome:</label>
                    <input type="text" id="nome_pet" class="form-control" th:required="required" th:field="${agendar.nome_pet}" />
                </div>

                <div class="form-group col-sm-4 mt-1">
                    <label for="raça_pet">Raça:</label>
                    <input type="text" id="raça_pet" class="form-control" th:required="required" th:field="${agendar.raça_pet}" />
                </div>
                        
                <p class="mt-3">Detalhes</p>
                            
                <div class="form-group col-sm-4 mt-1">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" class="form-control" th:required="required" th:field="${agendar.nome}" />
                </div>

                <div class="form-group col-sm-4 mt-1">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" class="form-control" th:required="required" th:field="${agendar.telefone}" />
                </div>
                
                <div class="form-group col-sm-4 mt-1">
                    <label for="data">Data:</label>
                    <input type="date" id="data" class="form-control" th:required="required" th:field="${agendar.data}" />
                </div>
                
                <div class="form-group col-sm-2 mt-3">
                    <label for="horario">Horário:</label>
                    <input type="time" id="horario" class="form-control" th:required="required" th:field="${agendar.horario}" />
                </div>
                
                <div class="col-sm-4 mt-3 offset-sm-2">
                    <label>Profissionais:</label>
                    <br>
                    <input type="radio" value="Sem preferência" th:field="${agendar.profissional}"/>Sem preferência
                    <br>
                    <input type="radio" value="Maria" th:field="${agendar.profissional}"/>Maria
                    <br>
                    <input type="radio" value="João" th:field="${agendar.profissional}"/>João
                    <br>
                    <input type="radio" value="Ana" th:field="${agendar.profissional}"/>Ana
                </div>
                
                <div class="col-sm-4 mt-3">
                    <label>Serviços:</label>
                    <br>
                    <input type="radio" value="Banho e Tosa" th:field="${agendar.serviços}"/>Banho e Tosa
                    <br>
                    <input type="radio" value="Tosa Higiênica" th:field="${agendar.serviços}"/>Tosa Higiênica
                    <br>
                    <input type="radio" value="Tosa Máquina" th:field="${agendar.serviços}"/>Tosa Máquina
                    <br>
                    <input type="radio" value="Tosa Tesoura" th:field="${agendar.serviços}"/>Tosa Tesoura
                </div>
                
                <div class="form-group col-sm-4 mt-3">
                    <label for="observaçao" class="form-label">Observações:</label>
                    <textarea id="observaçao" class="form-control" rows="5" th:field="${agendar.observaçoes}"></textarea>
                </div>
                
                <div class="col-sm-12 mt-3 offset-sm-5 p-3">
                    <button type="submit" class="btn btn-lg" style="background-color: blueviolet; color: white">Finalizar</button>
                </div>
                
            </form>
 
        
        </div>
         

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous">
    </body>
    </html>
